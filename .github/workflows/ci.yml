name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [ "full", "no-rust", "pure-r" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Rust
        if: matrix.mode == 'full'
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Install R package dependencies
        run: |
          Rscript -e "install.packages(c('Rcpp', 'sf', 'data.table', 'testthat', 'rcmdcheck'), repos = 'https://cloud.r-project.org/')"

      - name: Configure backend build mode
        run: |
          echo "GPS2GTFS_CI_MODE=${{ matrix.mode }}" >> "$GITHUB_ENV"
          if [ "${{ matrix.mode }}" = "no-rust" ]; then
            echo "FORCE_NO_RUST=true" >> "$GITHUB_ENV"
          elif [ "${{ matrix.mode }}" = "pure-r" ]; then
            echo "FORCE_PURE_R=true" >> "$GITHUB_ENV"
          fi

      - name: Run R CMD check
        run: |
          R CMD build .
          R CMD check --no-manual gps2gtfs_*.tar.gz

      - name: Check formatting
        run: git diff --check
