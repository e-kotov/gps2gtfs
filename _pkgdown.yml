url: https://e-kotov.github.io/gps2gtfs/

template:
  bootstrap: 5
  light-switch: true
  includes:
    in_header: |
      <!-- goatcounter analytics -->
      <script data-goatcounter="https://jukadipos.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
      <!-- counter.dev analytics -->
      <script src="https://cdn.counter.dev/script.js" data-id="7e3e8d31-9a84-48b0-a678-a00715236a90" data-utcoffset="1"></script>
      <script>
       (function(h,o,t,j,a,r){
           h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
           h._hjSettings={hjid:3578286,hjsv:6};
           a=o.getElementsByTagName('head')[0];
           r=o.createElement('script');r.async=1;
           r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
           a.appendChild(r);
       })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
      </script>

authors:
  Egor Kotov:
    href: "https://www.ekotov.pro"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]

reference:
  - title: "Clean GPS"
    desc: >
      Normalise raw pings: canonical column names, timezone, deduplication.
    contents:
      - g2g_clean_gps
  - title: "Stops and terminals"
    desc: >
      Build the stop and terminal tables the extractor needs, from a planned
      GTFS feed, from route geometry, or from annotated Vehicle Positions.
    contents:
      - starts_with("g2g_stops_from_")
      - starts_with("g2g_terminals_from_")
  - title: "Trips and stop times"
    desc: >
      Cut trajectories into trips, detect stop visits, and inspect what was
      kept and dropped at each stage.
    contents:
      - starts_with("g2g_extract_trips")
      - g2g_diagnostics
  - title: "Shapes"
    contents:
      - g2g_shapes_from_trips
  - title: "Example data"
    desc: >
      One bus on route 654 (Kandy to Digana, Sri Lanka) for one day, with the
      route's stops and terminals; from the original Python gps2gtfs.
    contents:
      - starts_with("g2g_data_")
